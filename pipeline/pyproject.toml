[project]
name = "livingdex-pipeline"
version = "0.1.0"
description = "Builds the Living Dex Tracker dataset from PokeAPI and scraped sources."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    # Only for one job, and only on one sheet: the Archives pad every Generation 7 sprite into
    # a fixed 240 pixel frame, and the padding has to come off before the picture is written.
    "pillow>=10",
    "pydantic>=2.7",
    "selectolax>=0.3.21",
]

[project.scripts]
livingdex-pipeline = "livingdex_pipeline.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livingdex_pipeline"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
